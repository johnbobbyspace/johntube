  <title>Videos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0f0f0f; color: #fff; padding: 16px; font-family: system-ui, -apple-system, sans-serif; }
    
    /* Pagination Tugmalari Dizayni - Sahifa Markazida */
    .pagination-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
      padding: 10px;
    }

    .page-btn {
      background-color: #212121;
      color: #aaa;
      border: 1px solid #383838;
      padding: 10px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .page-btn:hover {
      background-color: #383838;
      color: #fff;
    }

    .page-btn.active {
      background-color: #ff0000;
      color: #fff;
      border-color: #ff0000;
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
    }

    /* Video Grid va Cardlar */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .card { background-color: #000; border-radius: 8px; overflow: hidden; }
    .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; }
    .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
  </style>
</head>

    const ITEMS_PER_PAGE = 12; // Har bir sahifada 12 ta video ko'rsatiladi
    let currentPage = 1;

    // Videolarni ekranga chiqarish
    function renderVideos(page) {
      const grid = document.getElementById("videoGrid");
      grid.innerHTML = "";

      const start = (page - 1) * ITEMS_PER_PAGE;
      const end = start + ITEMS_PER_PAGE;
      const currentVideos = videoIds.slice(start, end);

      currentVideos.forEach(id => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="video-wrapper">
            <iframe src="https://www.youtube.com/embed/${id}" loading="lazy" allowfullscreen></iframe>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Part 1, Part 2 tugmalarini hosil qilish
    function renderPagination() {
      const container = document.getElementById("pagination");
      const totalPages = Math.ceil(videoIds.length / ITEMS_PER_PAGE);
      container.innerHTML = "";

      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement("button");
        btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
        btn.innerText = `Part ${i}`;
        btn.onclick = () => {
          currentPage = i;
          renderVideos(currentPage);
          renderPagination();
          window.scrollTo({ top: 0, behavior: 'smooth' }); // Tugma bosilganda sahifa tepasiga silliq siljiydi
        };
        container.appendChild(btn);
      }
    }

    // Boshlang'ich yuklanish
    renderVideos(currentPage);
    renderPagination();
